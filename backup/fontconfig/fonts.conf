<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
    <!--
 Artificial oblique for fonts without an italic or oblique version
 -->
    <match target="font">
        <!-- check to see if the font is roman -->
        <test name="slant">
            <const>roman</const>
        </test>
        <!-- check to see if the pattern requested non-roman -->
        <test compare="not_eq" name="slant" target="pattern">
            <const>roman</const>
        </test>
        <!-- multiply the matrix to slant the font -->
        <edit mode="assign" name="matrix">
            <times>
                <name>matrix</name>
                <matrix>
                    <double>1</double>
                    <double>0.2</double>
                    <double>0</double>
                    <double>1</double>
                </matrix>
            </times>
        </edit>
        <!-- pretend the font is oblique now -->
        <edit mode="assign" name="slant">
            <const>oblique</const>
        </edit>
        <!-- and disable embedded bitmaps for artificial oblique -->
        <edit mode="assign" name="embeddedbitmap">
            <bool>false</bool>
        </edit>
    </match>
    <!--
 Synthetic emboldening for fonts that do not have bold face available
 -->
    <match target="font">
        <!-- check to see if the weight in the font is less than medium which possibly need
        emboldening -->
        <test compare="less_eq" name="weight">
            <const>medium</const>
        </test>
        <!-- check to see if the pattern requests bold -->
        <test compare="more_eq" name="weight" target="pattern">
            <const>bold</const>
        </test>
        <!--
		  set the embolden flag
		  needed for applications using cairo, e.g. gucharmap, gedit, ...
		-->
        <edit mode="assign" name="embolden">
            <bool>true</bool>
        </edit>
        <!--
		 set weight to bold
		 needed for applications using Xft directly, e.g. Firefox, ...
		-->
        <edit mode="assign" name="weight">
            <const>bold</const>
        </edit>
    </match>
    <match target="font">
        <edit mode="assign" name="hinting">
            <bool>true</bool>
        </edit>
    </match>
    <match target="font">
        <edit mode="assign" name="hintstyle">
            <const>hintslight</const>
        </edit>
    </match>
    <dir>~/.local/share/fonts</dir>
    <!-- 将 sans-serif, microsoft yahei 映射到 Noto Sans CJK SC -->
    <match target="pattern">
        <test name="family">
            <string>sans-serif</string>
        </test>
        <edit binding="strong" mode="prepend" name="family">
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="family">
            <string>microsoft yahei</string>
        </test>
        <edit binding="strong" mode="prepend" name="family">
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>
    <!-- 令 Noto Sans/Serif 显示中文字形 -->
    <match target="pattern">
        <test name="family">
            <string>Noto Sans</string>
        </test>
        <edit binding="strong" mode="prepend" name="family">
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="family">
            <string>Noto Serif</string>
        </test>
        <edit binding="strong" mode="prepend" name="family">
            <string>Noto Serif CJK SC</string>
        </edit>
    </match>
    <!-- 设置默认等宽字体 -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>monospace</string>
        </test>
        <edit binding="strong" mode="prepend" name="family">
            <string>Maple Mono NL NF CN</string>
        </edit>
    </match>
    <!-- 设置 Maple Font 特性 -->
    <match target="pattern">
        <test name="family">
            <string>Maple Mono NL NF CN</string>
        </test>
        <edit name="fontfeatures" mode="append">
            <string>zero on</string>
        </edit>
    </match>
</fontconfig>
