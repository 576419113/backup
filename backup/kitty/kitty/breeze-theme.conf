# 终端0-15颜色样式
color0     #232627
color1     #ed1515
color2     #11d116
color3     #f67400
color4     #1d99f3
color5     #9b59b6
color6     #1abc9c
color7     #fcfcfc
color8     #7f8c8d
color9     #c0392b
color10    #1cdc9a
color11    #fdbc4b
color12    #3daee9
color13    #8e44ad
