##############
#  字体样式  #
##############
font_family            hack
bold_font              auto
italic_font            auto
bold_italic_font       auto
font_size              12.0
undercurl_style        thin-sparse
underline_exclusion    1

##############
#  光标样式  #
##############
cursor                          none
cursor_text_color               background
cursor_shape                    block
cursor_shape_unfocused          unchanged
cursor_blink_interval           0
cursor_trail                    1
cursor_trail_decay              0.1 0.4
cursor_trail_start_threshold    0


##########
#  回滚  #
##########
scrollback_lines    2000
scroll_bar          scrolled
progress_bar        left


##############
#  鼠标样式  #
##############
mouse_hide_wait                 -1
url_color                       #3daee9
url_style                       straight
open_url_with                   xdg-open
url_prefixes                    file ftp ftps git http https kitty sftp ssh
detect_urls                     yes
default_pointer_shape           beam
pointer_shape_when_grabbed      arrow
pointer_shape_when_dragging     beam crosshair


##############
#  响铃设置  #
##############
enable_audio_bell    no


##############
#  窗口样式  #
##############
remember_window_size        no
initial_window_width        1280
initial_window_height       640
remember_window_position    no
window_margin_width         2


##############
#  颜色样式  #
##############
foreground              #fcfcfc
background              #232627
selection_foreground    #fcfcfc
selection_background    #3daee9
color0     #232627
color1     #ed1515
color2     #11d116
color3     #f67400
color4     #1d99f3
color5     #9b59b6
color6     #1abc9c
color7     #fcfcfc
color8     #7f8c8d
color9     #c0392b
color10    #1cdc9a
color11    #fdbc4b
color12    #3daee9
color13    #8e44ad
color14    #16a085
color15    #ffffff


##############
#  高级配置  #
##############
auto_reload_config        1
allow_hyperlinks          yes
shell_integration         no-cursor
wayland_titlebar_color    system
linux_display_server      auto
wayland_enable_ime        yes
