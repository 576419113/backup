# 载入中国传统色主题
# include cncolors-bright.conf
include cncolors-dark.conf

##############
#  字体样式  #
##############
font_family            hack
bold_font              auto
italic_font            auto
bold_italic_font       auto
font_size              12.0
undercurl_style        thin-sparse
underline_exclusion    1

##############
#  光标样式  #
##############
cursor                          none
cursor_text_color               background
cursor_shape                    block
cursor_shape_unfocused          unchanged
cursor_blink_interval           0
cursor_trail                    1
cursor_trail_decay              0.1 0.4
cursor_trail_start_threshold    0


##########
#  回滚  #
##########
scrollback_lines           2000
scroll_bar                 scrolled
progress_bar               left


##############
#  鼠标样式  #
##############
mouse_hide_wait                 -1
url_color                       #3daee9
url_style                       straight
open_url_with                   xdg-open
url_prefixes                    file ftp ftps git http https kitty sftp ssh
detect_urls                     yes
default_pointer_shape           beam
pointer_shape_when_grabbed      arrow
pointer_shape_when_dragging     beam crosshair


##############
#  响铃设置  #
##############
enable_audio_bell    no


##############
#  窗口样式  #
##############
remember_window_size           no
initial_window_width           1280
initial_window_height          640
remember_window_position       no
window_border_width            0.5pt
window_margin_width            0
window_padding_width           2 2
single_window_padding_width    0


##############
#  高级配置  #
##############
auto_reload_config        0.1
allow_hyperlinks          yes
shell_integration         no-cursor
wayland_titlebar_color    system
linux_display_server      auto
wayland_enable_ime        yes
